<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Geral de Produtos</title>
    <style>
        :root {
            --bg: #121212; --surface: #1e1e1e; --surface-light: #2a2a2a;
            --text: #e0e0e0; --text-muted: #9e9e9e;
            --primary: #4CAF50; --danger: #F44336; --warning: #FF9800;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;}
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .btn-voltar { background-color: var(--surface-light); color: var(--text); border: 1px solid #444; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .btn-voltar:hover { background-color: var(--primary); }
        .header h1 { color: var(--primary); font-size: 26px; }
        
        .table-wrapper { flex: 1; overflow: auto; background: var(--surface); border-radius: 10px; position: relative;}
        table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
        
        th { 
            background-color: #111; padding: 15px; font-size: 13px; color: var(--text-muted); 
            border-bottom: 2px solid var(--primary); cursor: pointer; position: sticky; top: 0; z-index: 10;
            user-select: none; transition: color 0.2s; white-space: nowrap;
        }
        th:hover { color: #fff; }
        
        th span.seta { font-size: 14px; margin-left: 5px; color: var(--primary); }
        
        td { padding: 12px 15px; border-bottom: 1px solid #333; font-size: 14px; }
        tr:hover td { background-color: var(--surface-light); }
        
        a { color: var(--primary); text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-subiu { background: rgba(244, 67, 54, 0.2); color: var(--danger); }
        .badge-desceu { background: rgba(76, 175, 80, 0.2); color: var(--primary); }
        .badge-neutro { background: rgba(158, 158, 158, 0.2); color: var(--text-muted); }
        
        .vol-baixa { color: var(--primary); }
        .vol-moderada { color: var(--warning); }
        .vol-alta { color: var(--danger); }
        #carregando { text-align: center; font-size: 20px; margin-top: 50px; color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <a href="/" class="btn-voltar">← Voltar</a>
            <h1>Ranking Geral de Produtos</h1>
        </div>
        <div id="ano-referencia" style="font-size: 18px; color: var(--text-muted); font-weight: bold;"></div>
    </div>

    <div id="carregando">Carregando dados de todos os produtos...</div>

    <div class="table-wrapper" id="tabela-container" style="display: none;">
        <table id="tabela-ranking">
            <thead>
                <tr>
                    <th onclick="ordenarTabela(0, 'string', this)" title="Nome do produto.">Produto <span class="seta"></span></th>
                    <th onclick="ordenarTabela(1, 'number', this)" title="O valor da última pesquisa.">Último Preço <span class="seta"></span></th>
                    <th onclick="ordenarTabela(2, 'number', this)" title="Média dos meses.">Preço Médio <span class="seta"></span></th>
                    <th onclick="ordenarTabela(3, 'number', this)" title="Variação entre o 1º e o último mês.">Variação Total (%) <span class="seta"></span></th>
                    <th onclick="ordenarTabela(4, 'string', this)" title="Menor e maior preço.">Min / Max <span class="seta"></span></th>
                    <th onclick="ordenarTabela(5, 'volatilidade', this)" title="Oscilação do preço.">Volatilidade <span class="seta"></span></th>
                    <th onclick="ordenarTabela(6, 'number', this)" title="Posição no ranking de variação.">Ranking Inflação <span class="seta"></span></th>
                    <th onclick="ordenarTabela(7, 'number', this)" title="% de meses preenchidos.">Completude <span class="seta"></span></th>
                </tr>
            </thead>
            <tbody id="corpo-ranking"></tbody>
        </table>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const ano = pathParts[2];
        document.getElementById('ano-referencia').innerText = `Ano: ${ano}`;

        let colunaAtual = -1; 
        let crescente = true;

        async function carregarRanking() {
            try {
                const response = await fetch(`/api/ranking/${ano}`);
                if (!response.ok) throw new Error("Erro ao buscar dados.");
                
                const dados = await response.json();
                renderizarTabela(dados);

                const thProduto = document.querySelectorAll('th')[0];
                ordenarTabela(0, 'string', thProduto);

                document.getElementById('carregando').style.display = 'none';
                document.getElementById('tabela-container').style.display = 'block';

            } catch (erro) {
                document.getElementById('carregando').innerText = "Erro: " + erro.message;
            }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('corpo-ranking');
            tbody.innerHTML = '';

            dados.forEach(item => {
                const tr = document.createElement('tr');
                
                tr.dataset.produto = item.produto;
                tr.dataset.ultimo_preco = item.ultimo_preco;
                tr.dataset.media = item.media;
                tr.dataset.var_total = item.var_total;
                tr.dataset.minimo = item.minimo;
                tr.dataset.maximo = item.maximo;
                tr.dataset.volatilidade = item.volatilidade;
                tr.dataset.cv = item.cv;
                tr.dataset.ranking = item.ranking;
                tr.dataset.completude = item.completude;

                // VARIAÇÃO TOTAL (2 CASAS)
                let varStr = `${item.var_total > 0 ? '+' : ''}${item.var_total.toFixed(2)}%`;
                let varClass = item.var_total > 0 ? 'badge-subiu' : (item.var_total < 0 ? 'badge-desceu' : 'badge-neutro');
                let volClass = item.volatilidade === 'Baixa' ? 'vol-baixa' : (item.volatilidade === 'Moderada' ? 'vol-moderada' : 'vol-alta');

                // VOLATILIDADE (2 CASAS) E COMPLETUDE (2 CASAS)
                tr.innerHTML = `
                    <td><a href="/estatisticas/${ano}/${encodeURIComponent(item.produto)}">${item.produto}</a></td>
                    <td>R$ ${item.ultimo_preco.toFixed(2).replace('.', ',')}</td>
                    <td>R$ ${item.media.toFixed(2).replace('.', ',')}</td>
                    <td><span class="badge ${varClass}">${varStr}</span></td>
                    <td>R$ ${item.minimo.toFixed(2).replace('.', ',')} / R$ ${item.maximo.toFixed(2).replace('.', ',')}</td>
                    <td class="${volClass}">${item.volatilidade} (${item.cv.toFixed(2)}%)</td>
                    <td>${item.ranking}º</td>
                    <td>${item.completude.toFixed(2)}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function ordenarTabela(colunaIndex, tipo, thElement) {
            document.querySelectorAll('.seta').forEach(s => s.innerText = '');

            if (colunaAtual === colunaIndex) {
                crescente = !crescente;
            } else {
                colunaAtual = colunaIndex;
                crescente = true;
            }

            const spanSeta = thElement.querySelector('.seta');
            spanSeta.innerText = crescente ? '↑' : '↓';

            const tbody = document.getElementById('corpo-ranking');
            const linhas = Array.from(tbody.querySelectorAll('tr'));

            const chaves = ['produto', 'ultimo_preco', 'media', 'var_total', 'minimo', 'volatilidade', 'ranking', 'completude'];
            const chave = chaves[colunaIndex];

            linhas.sort((a, b) => {
                let valA = a.dataset[chave];
                let valB = b.dataset[chave];

                if (tipo === 'string') {
                    return crescente ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } 
                else if (tipo === 'volatilidade') {
                    let numA = parseFloat(a.dataset.cv) || 0;
                    let numB = parseFloat(b.dataset.cv) || 0;
                    return crescente ? numA - numB : numB - numA;
                } 
                else {
                    let numA = parseFloat(valA) || 0;
                    let numB = parseFloat(valB) || 0;
                    return crescente ? numA - numB : numB - numA;
                }
            });

            tbody.innerHTML = '';
            linhas.forEach(linha => tbody.appendChild(linha));
        }

        carregarRanking();
    </script>
</body>
</html>
